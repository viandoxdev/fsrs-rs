[package]
name = "fsrs"
version = "2.0.3"
authors = ["Open Spaced Repetition"]
categories = ["algorithms", "science"]
edition = "2021"
homepage = "https://github.com/open-spaced-repetition"
keywords = ["spaced-repetition", "algorithm", "fsrs", "machine-learning"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/open-spaced-repetition/fsrs-rs"
rust-version = "1.81.0"
description = "FSRS for Rust, including Optimizer and Scheduler"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.burn]
version = "0.16.0"
git = "https://github.com/open-spaced-repetition/burn.git"
rev = "952efa098fe86cdaa571a04e7bc9c4fe748aaba4"
default-features = false
features = ["std", "train", "autodiff", "browser", "ndarray"]

[dev-dependencies.burn]
version = "0.16.0"
git = "https://github.com/open-spaced-repetition/burn.git"
rev = "952efa098fe86cdaa571a04e7bc9c4fe748aaba4"
default-features = false
features = ["std", "train", "autodiff", "browser", "ndarray"]

[dependencies]
itertools = "0.12.0"
log = "0.4"
ndarray = "0.15.6"
ndarray-rand = "0.14.0"
priority-queue = "2.1.1"
rand = "0.8.5"
rayon = "1.8.0"
serde = "1.0.193"
snafu = "0.8.0"
strum = { version = "0.26.1", features = ["derive"] }
chrono = { version = "0.4.31", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.8.4"
wasm-bindgen = "0.2.91"

[dev-dependencies]
criterion = { version = "0.5.1" }
csv = "1.3.0"
fern = "0.6.0"
rusqlite = { version = "0.32.0" }

[[bench]]
name = "benchmark"
harness = false

[[example]]
name = "schedule"
path = "examples/schedule.rs"

[[example]]
name = "migrate"
path = "examples/migrate.rs"

[[example]]
name = "optimize"
path = "examples/optimize.rs"
